
# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix


# split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'   # -v
unbind '%'   # -h

# open new windows in the current path
bind c new-window -c "#{pane_current_path}"


# switch panes using vim-mode hjkl 
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D


# Enable mouse control (clickable windows, panes, resizable panes)
# set -g mouse-select-window on
# set -g mouse-select-pane on
# set -g mouse-resize-pane on
# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# don't rename windows automatically
set -g allow-rename off

# set default terminal mode to 256 colors
set -g default-terminal "screen-256color"

# start with window 1 (instead of 0)
set -g base-index 1

# Make copy work like vi
# Start copy ^b-[
# Use vi movement keys (arrows, etc.)
# Select with v, V
# Yank and end copy mode with y
# Paste with ^b-]
# View all vi key bindings with ^b-: followed with list-keys -T copy-mode-vi
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel


# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# Enable activity warning.
setw -g monitor-activity on
set -g visual-activity on

# set -g status-justify centre

set -g history-limit 10000

# Enable terminal image preview passthrough for Yazi.
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Plugins managed by TPM.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Restore pane scrollback, but resume interactive tools manually.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'vim view'

# Load optional machine-local overrides before plugin initialization.
if-shell 'test -f ~/.tmux.conf.local' 'source-file ~/.tmux.conf.local'

# Bootstrap TPM and install declared plugins on first load.
if-shell 'test ! -d "$HOME/.tmux/plugins/tpm"' {
  run-shell 'git clone --depth 1 https://github.com/tmux-plugins/tpm "$HOME/.tmux/plugins/tpm" && "$HOME/.tmux/plugins/tpm/tpm" && "$HOME/.tmux/plugins/tpm/bin/install_plugins"'
}

# Initialize TPM after all plugin declarations and local overrides.
if-shell 'test -x "$HOME/.tmux/plugins/tpm/tpm"' {
  run-shell '"$HOME/.tmux/plugins/tpm/tpm"'
}
